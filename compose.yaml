services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: slaughterhouse
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?saet POSTGRES_PASSWORD i .env}
    ports:
      - "5432:5432"
    volumes:
      - slaughterhouse-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d slaughterhouse"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  slaughterhouse-postgres:
