spring.application.name=cutting-service

server.port=${SERVER_PORT:8082}

spring.datasource.url=${CUTTING_DB_URL:jdbc:h2:file:./data/cuttingdb;AUTO_SERVER=TRUE}
spring.datasource.username=${CUTTING_DB_USERNAME:sa}
spring.datasource.password=${CUTTING_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.outbox.publisher.enabled=true
app.outbox.publisher.fixed-delay-ms=5000
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}
