spring.application.name=packing-service

server.port=${SERVER_PORT:8084}

spring.datasource.url=${PACKING_DB_URL:jdbc:h2:file:./data/packingdb;AUTO_SERVER=TRUE}
spring.datasource.username=${PACKING_DB_USERNAME:sa}
spring.datasource.password=${PACKING_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.outbox.publisher.enabled=true
app.outbox.publisher.fixed-delay-ms=5000
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}
