spring.application.name=packing-service

server.port=${SERVER_PORT:8083}

spring.datasource.url=${PACKING_DB_URL:jdbc:h2:file:./data/packingdb;AUTO_SERVER=TRUE}
spring.datasource.username=${PACKING_DB_USERNAME:sa}
spring.datasource.password=${PACKING_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true

app.events.exchange=${EVENTS_EXCHANGE:slaughterhouse.events}

app.outbox.publisher.enabled=true
app.outbox.publisher.fixed-delay-ms=5000
