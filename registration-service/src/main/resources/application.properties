spring.application.name=registration-service

server.port=${SERVER_PORT:8081}

spring.datasource.url=${REGISTRATION_DB_URL:jdbc:h2:file:./data/registrationdb}
spring.datasource.username=${REGISTRATION_DB_USERNAME:sa}
spring.datasource.password=${REGISTRATION_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.rabbitmq.host=${RABBITMQ_HOST:localhost}
spring.rabbitmq.port=${RABBITMQ_PORT:5672}
spring.rabbitmq.username=${RABBITMQ_USERNAME:guest}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:guest}

app.outbox.publisher.enabled=true
app.outbox.publisher.fixed-delay-ms=5000
