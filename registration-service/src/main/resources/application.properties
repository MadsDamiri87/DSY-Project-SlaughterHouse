spring.application.name=registration-service

server.port=${SERVER_PORT:8081}

spring.datasource.url=${REGISTRATION_DB_URL:jdbc:h2:file:./data/registrationdb;AUTO_SERVER=TRUE}
spring.datasource.username=${REGISTRATION_DB_USERNAME:sa}
spring.datasource.password=${REGISTRATION_DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.outbox.publisher.enabled=true
app.outbox.publisher.fixed-delay-ms=5000
app.backend.base-url=${BACKEND_BASE_URL:http://localhost:8080}

app.slaughterhouse.timezone=${SLAUGHTERHOUSE_TIMEZONE:UTZ-0}
